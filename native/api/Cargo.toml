[package]
name = "mod-hempdustry"
version = "0.1.0"
edition = "2024"

[dependencies]
# The launcher points this at the Horizon source it builds the game from. Any other
# dependency must be a crate and version in Horizon's Cargo.lock.
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "2ebf00a0281c592f79191e76fce0e7d522c6f425" }
# The advancement conditions Horizon hands a criterion test (in Horizon's Cargo.lock).
serde_json = "1.0.151"

# Checked by `cargo clippy --all-targets`; a lint the code breaks on purpose is answered where it
# happens with `#[expect(…, reason = "…")]`.
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# From the nursery: a `&mut` that is never written through, a lock held past its last use.
needless_pass_by_ref_mut = "warn"
significant_drop_tightening = "warn"
